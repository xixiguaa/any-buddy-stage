packages:
  - .

allowBuilds:
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: true

blockExoticSubdeps: false

confirmModulesPurge: false

nodeLinker: hoisted

onlyBuiltDependencies:
